[project]
name = "g4al-survival"
version = "0.2.0"
description = "Voice-controlled 2D top-down survival game: command NPCs with Mistral Voxtral"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "elevenlabs>=2.37.0",
    "flask>=3.0",
    "flask-socketio>=5.6.1",
    "loguru>=0.7.3",
    "mistralai[realtime]>=3.8.0",
    "pygame>=2.5",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "import-linter>=2.16",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.15.4",
    "vulture>=2.14",
]

########################################################################################################################
# Pytest & coverage
########################################################################################################################

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["game", "api", "server", "scripts"]
branch = true

[tool.coverage.report]
fail_under = 83
show_missing = true
skip_covered = true

########################################################################################################################
# Vulture (dead code)
########################################################################################################################

[tool.vulture]
paths = ["game", "api", "server", "main.py", "vulture_allowlist.py"]
min_confidence = 60
# Flask and Socket.IO call the handlers they register; nothing else references them.
ignore_decorators = ["@routes.*", "@socketio.on"]

########################################################################################################################
# Import contracts (lint-imports, run by `make lint-check`)
########################################################################################################################
# Layer rule of `.claude/rules/architecture.md`: the domain imports no adapter, no entry
# point and no library that talks to an outside system, `TYPE_CHECKING` imports included.

[tool.importlinter]
root_packages = ["game", "api"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "game imports no adapter, entry point or I/O library"
type = "forbidden"
source_modules = ["game"]
forbidden_modules = [
    "api",
    "server",
    "main",
    "flask",
    "flask_socketio",
    "mistralai",
    "elevenlabs",
    "pygame",
    "loguru",
    "dotenv",
]
